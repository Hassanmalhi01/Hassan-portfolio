<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B2D24"/>
      <stop offset="100%" stop-color="#1B1D16"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F5E2C"/>
      <stop offset="100%" stop-color="#242621"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#8FBF5F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8FBF5F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#glow)"/>
  <!-- shoulders -->
  <path d="M40 500 C40 380 130 340 200 340 C270 340 360 380 360 500 Z" fill="url(#person)"/>
  <!-- neck -->
  <rect x="175" y="290" width="50" height="70" fill="#2B2D24"/>
  <!-- head -->
  <ellipse cx="200" cy="230" rx="78" ry="92" fill="url(#person)"/>
  <!-- subtle jaw shading -->
  <path d="M130 240 C140 300 170 320 200 320 C230 320 260 300 270 240 C260 280 230 300 200 300 C170 300 140 280 130 240 Z" fill="#1B1D16" opacity="0.25"/>
  <text x="200" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#9A9D8E" letter-spacing="1">PLACEHOLDER — REPLACE VIA ADMIN PANEL</text>
</svg>
